name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please do not attach copyrighted audio. Describe the files instead.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command and output
      description: The command you ran and its full output.
      render: shell
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Config
      description: Your `solo.toml` / `songs.toml` (remove anything private).
      render: toml
  - type: input
    id: files
    attributes:
      label: Stem files
      description: Format, sample rate, bit depth, e.g. "WAV 48 kHz 24 bit from Moises".
  - type: input
    id: version
    attributes:
      label: Version and OS
      description: Output of `stem-solo-gap --version`, and your operating system.
    validations:
      required: true
