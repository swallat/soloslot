[project]
name = "soloslot"
version = "0.3.0"
description = "Mute instruments in the solo of a song to build play-along backing tracks"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Sebastian Wallat" }]
keywords = ["audio", "stems", "stem-separation", "demucs", "backing-track", "play-along", "practice"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Sound/Audio",
]
dependencies = [
  "click>=8.1",
  "numpy>=1.26",  # demucs needs numpy<2 on Intel Macs
  "soundfile>=0.13"  # wheels bundle libsndfile 1.2 with MP3 encoding,
]

[project.optional-dependencies]
# Split full songs into stems. Pulls in PyTorch (large download).
separate = ["demucs>=4.1"]
# Desktop window (soloslot-gui).
gui = ["PySide6-Essentials>=6.7", "sounddevice>=0.4.6"]

[project.urls]
Homepage = "https://github.com/swallat/soloslot"
Source = "https://github.com/swallat/soloslot"
Issues = "https://github.com/swallat/soloslot/issues"

[project.scripts]
soloslot = "soloslot.cli:main"

[project.gui-scripts]
soloslot-gui = "soloslot.gui.app:main"

[dependency-groups]
dev = [
  "pytest>=8.0",
  "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/soloslot"]

[tool.uv]
python-preference = "only-managed"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
