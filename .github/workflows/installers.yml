name: Installers

# Builds the desktop app (slim: no PyTorch) for Windows, macOS and Linux.
# Called by release.yml for version tags; also runs on pull requests that touch packaging
# so that breakage is found before a release.
on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    paths:
      - "packaging/**"
      - ".github/workflows/installers.yml"
      - "pyproject.toml"
      - "uv.lock"
      - "src/soloslot/gui/**"

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: macos-latest
            name: macos
          - os: ubuntu-22.04 # older glibc: the AppImage runs on more distributions
            name: linux
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.5"
      - name: Package version
        id: v
        shell: bash
        run: echo "version=$(uv run --no-project python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")" >> "$GITHUB_OUTPUT"
      - name: Linux system libraries for Qt
        if: matrix.name == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libxcb-cursor0 libportaudio2
      - name: Build with PyInstaller
        shell: bash
        run: packaging/build.sh
      - name: Bundle PortAudio (Linux)
        if: matrix.name == 'linux'
        run: cp -L "$(ldconfig -p | awk '/libportaudio\.so\.2 /{print $NF; exit}')" dist/soloslot/_internal/
      - name: Self test
        shell: bash
        run: |
          if [ "${{ matrix.name }}" = macos ]; then exe=dist/soloslot.app/Contents/MacOS/soloslot
          elif [ "${{ matrix.name }}" = windows ]; then exe=dist/soloslot/soloslot.exe
          else exe=dist/soloslot/soloslot; fi
          "$exe" --version
          "$exe" --selftest

      - name: Windows installer (Inno Setup)
        if: matrix.name == 'windows'
        shell: pwsh
        run: |
          python packaging/notices_txt.py build/THIRD_PARTY_NOTICES.txt
          iscc /DAppVersion=${{ steps.v.outputs.version }} packaging\windows\soloslot.iss

      - name: macOS disk image
        if: matrix.name == 'macos'
        run: |
          mkdir -p installers dmg
          cp -R dist/soloslot.app dmg/
          ln -s /Applications dmg/Applications
          cp packaging/icons/soloslot.icns dmg/.VolumeIcon.icns
          SetFile -a C dmg
          hdiutil create -volname soloslot -srcfolder dmg -ov -format UDZO \
            "installers/soloslot-${{ steps.v.outputs.version }}-macos-arm64.dmg"

      - name: Linux AppImage
        if: matrix.name == 'linux'
        run: |
          mkdir -p installers
          appdir=dist/soloslot.AppDir
          mkdir -p "$appdir/usr/bin"
          cp -r dist/soloslot/. "$appdir/usr/bin/"
          cp packaging/linux/soloslot.desktop packaging/icons/soloslot.png "$appdir/"
          cp packaging/icons/soloslot.png "$appdir/.DirIcon"
          mkdir -p "$appdir/usr/share/doc/soloslot"
          cp LICENSE src/soloslot/gui/assets/THIRD_PARTY_NOTICES.md "$appdir/usr/share/doc/soloslot/"
          printf '#!/bin/sh\nexec "$(dirname "$(readlink -f "$0")")/usr/bin/soloslot" "$@"\n' > "$appdir/AppRun"
          chmod +x "$appdir/AppRun"
          curl -fsSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run "$appdir" \
            "installers/soloslot-${{ steps.v.outputs.version }}-linux-x86_64.AppImage"

      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.name }}
          path: installers/*
          if-no-files-found: error
