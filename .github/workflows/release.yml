name: Release

# Publishes to PyPI when a version tag (v0.1.0, ...) is pushed, or when this workflow is started
# by hand (or by the weekly maintenance task) on main with the version to release. The run then
# creates the tag itself. Uses PyPI Trusted Publishing (OIDC), so no API token is stored in GitHub.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, as in pyproject.toml (for example 0.4.7). Creates the tag v<version> on main."
        required: true
        type: string

jobs:
  tag:
    runs-on: ubuntu-26.04
    permissions:
      contents: write  # creates the tag when started by hand
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.5"
      - name: Resolve the tag, creating it when started by hand
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "${EVENT}" = "push" ]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "A manual release must run on main, not ${GITHUB_REF}" >&2
            exit 1
          fi
          version="$(uv run --no-project python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          if [ "${INPUT_VERSION}" != "${version}" ]; then
            echo "Input version ${INPUT_VERSION} does not match pyproject.toml version ${version}" >&2
            exit 1
          fi
          tag="v${version}"
          existing="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" --jq .object.sha 2>/dev/null || true)"
          if [ -z "${existing}" ]; then
            gh api -X POST "repos/${GITHUB_REPOSITORY}/git/refs" -f ref="refs/tags/${tag}" -f sha="${GITHUB_SHA}" > /dev/null
          elif [ "${existing}" != "${GITHUB_SHA}" ]; then
            echo "Tag ${tag} already exists on ${existing}, not on ${GITHUB_SHA}" >&2
            exit 1
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

  build:
    needs: tag
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.5"
      - name: Check that the tag matches the package version
        env:
          TAG: ${{ needs.tag.outputs.tag }}
        run: |
          version="$(uv run --no-project python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          if [ "v${version}" != "${TAG}" ]; then
            echo "Tag ${TAG} does not match pyproject.toml version ${version}" >&2
            exit 1
          fi
      - run: uv sync --locked
      - run: uv run pytest
      - run: uv build
      - name: Smoke test the wheel
        run: uv run --no-project --isolated --with dist/*.whl soloslot --version
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-26.04
    environment: pypi
    permissions:
      id-token: write  # required for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  installers:
    needs: build
    uses: ./.github/workflows/installers.yml

  github-release:
    needs: [tag, publish, installers]
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          path: installers/
          merge-multiple: true
      - name: Checksums
        run: cd installers && sha256sum * > SHA256SUMS
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.tag.outputs.tag }}
        run: gh release create "${TAG}" dist/* installers/* --repo "${GITHUB_REPOSITORY}" --generate-notes --title "${TAG}"
