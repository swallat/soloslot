[project]
name = "stem-solo-gap"
version = "0.1.0"
description = "Clear a solo section out of stem WAVs to build play-along backing tracks"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Sebastian Wallat" }]
keywords = ["audio", "stems", "backing-track", "play-along", "practice"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Sound/Audio",
]
dependencies = [
  "click>=8.1",
  "numpy>=2.0",
  "soundfile>=0.12",
]

[project.urls]
Homepage = "https://github.com/swallat/stem-solo-gap"
Source = "https://github.com/swallat/stem-solo-gap"
Issues = "https://github.com/swallat/stem-solo-gap/issues"

[project.scripts]
stem-solo-gap = "stem_solo_gap.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.0",
  "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stem_solo_gap"]

[tool.uv]
python-preference = "only-managed"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
