name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Keep the check name "test (ubuntu-latest)": the branch ruleset requires it.
    name: test (${{ matrix.os == 'ubuntu-26.04' && 'ubuntu-latest' || matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.5"
      - run: uv sync --locked
      - run: uv run pytest
      - name: CLI smoke test
        run: uv run soloslot --version

  gui:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.5"
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: uv sync --locked --extra gui
      - run: uv run pytest tests/test_gui_app.py tests/test_gui_model.py
        env:
          QT_QPA_PLATFORM: offscreen

  lint:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.5"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
