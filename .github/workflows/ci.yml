name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.5"
      - run: uv sync --locked
      - run: uv run pytest
      - name: CLI smoke test
        run: uv run soloslot --version

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.5"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
