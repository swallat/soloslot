name: Release check

# Weekly: if pull requests labelled "security" were merged since the latest release, open (or
# keep) an issue that asks for a patch release. It never tags or publishes anything; a
# maintainer prepares the version bump and pushes the tag, which starts release.yml.
on:
  schedule:
    - cron: "43 4 * * 1"  # Monday, UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  check:
    runs-on: ubuntu-26.04
    steps:
      - name: Look for unreleased security fixes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          repo="$GITHUB_REPOSITORY"
          since="$(gh release view --repo "$repo" --json publishedAt --jq .publishedAt 2>/dev/null || true)"
          if [ -z "$since" ]; then echo "No release yet, nothing to compare."; exit 0; fi
          prs="$(gh pr list --repo "$repo" --state merged --label security --search "merged:>${since}" --json number,title --jq '.[] | "- #\(.number) \(.title)"')"
          if [ -z "$prs" ]; then echo "No unreleased security fixes."; exit 0; fi
          title="Release needed: unreleased security fixes"
          body="$(printf 'Security fixes were merged since the latest release (%s):\n\n%s\n\nPlease prepare a patch release: bump the version in `pyproject.toml`, move the changelog entry, merge, then push the matching `v*` tag.' "$since" "$prs")"
          number="$(gh issue list --repo "$repo" --state open --label security --search "\"$title\" in:title" --json number --jq '.[0].number // empty')"
          if [ -n "$number" ]; then
            gh issue edit "$number" --repo "$repo" --body "$body"
          else
            gh issue create --repo "$repo" --title "$title" --label security --body "$body"
          fi
